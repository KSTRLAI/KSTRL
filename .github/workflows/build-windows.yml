name: Build

# Publish a release either way:
#  • Actions tab → Build → Run workflow (publish = true), or
#  • push a tag like v1.0.1 that matches package.json's version.
# The release is tagged v<package.json version>. Installed copies of KSTRL pick it up
# automatically (they check GitHub Releases on launch and every 4h).
#
# Optional settings (repo → Settings → Secrets and variables → Actions):
#  • Variable KSTRL_API_URL — your API's address, built into the app so people only log in.
#  • Code signing with Azure Trusted Signing (removes the "Windows protected your PC" warning):
#      variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
#      secrets   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (v<package.json version>) that installed apps update to'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - name: Create the release (so every installer uploads into the same one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" --target "$GITHUB_SHA" --title "KSTRL $v" --notes "KSTRL $v. Windows: KSTRL-Setup.exe (installed copies update automatically). Mac: KSTRL-mac-arm64.dmg (Apple Silicon) or KSTRL-mac-x64.dmg (Intel)."

  windows:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Built-in API URL
        if: vars.KSTRL_API_URL != ''
        shell: bash
        env:
          API_URL: ${{ vars.KSTRL_API_URL }}
        run: node -e "require('fs').writeFileSync('electron/build-config.json', JSON.stringify({ unslothURL: process.env.API_URL }))"
      - run: npm run build
      - name: Build (and publish)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          PUBLISH: ${{ needs.release.result == 'success' && 'always' || 'never' }}
        run: |
          args=(--win --x64 --publish "$PUBLISH")
          if [ -n "$SIGN_ENDPOINT" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            args+=(-c.win.azureSignOptions.endpoint="$SIGN_ENDPOINT" -c.win.azureSignOptions.codeSigningAccountName="$SIGN_ACCOUNT" -c.win.azureSignOptions.certificateProfileName="$SIGN_PROFILE" -c.win.azureSignOptions.publisherName="$SIGN_PUBLISHER")
          else
            echo "No signing settings — building unsigned"
          fi
          npx electron-builder "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: KSTRL-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  mac:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Built-in API URL
        if: vars.KSTRL_API_URL != ''
        env:
          API_URL: ${{ vars.KSTRL_API_URL }}
        run: node -e "require('fs').writeFileSync('electron/build-config.json', JSON.stringify({ unslothURL: process.env.API_URL }))"
      - run: npm run build
      - name: Build (and publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PUBLISH: ${{ needs.release.result == 'success' && 'always' || 'never' }}
        run: npx electron-builder --mac --publish "$PUBLISH"
      - uses: actions/upload-artifact@v4
        with:
          name: KSTRL-mac
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: warn
