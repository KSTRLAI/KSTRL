name: Build Windows

# Publish a release either way:
#  • Actions tab → Build Windows → Run workflow (publish = true), or
#  • push a tag like v1.0.1 that matches package.json's version.
# The release is tagged v<package.json version>. Installed copies of KSTRL pick it up
# automatically (they check GitHub Releases on launch and every 4h).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (v<package.json version>) that installed apps update to'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }

      - run: npm run build

      - name: Create the release (so both installers upload into the same one)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" --target "$GITHUB_SHA" --title "KSTRL $v" --notes "KSTRL $v for Windows. Installed copies update automatically; new users download KSTRL-Setup.exe."

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: KSTRL-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
