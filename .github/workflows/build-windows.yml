name: Build Windows

# Push a tag like v1.0.1 to publish a release. Installed copies of KSTRL
# pick it up automatically (they check GitHub Releases on launch and every 4h).
# "Run workflow" from the Actions tab builds the .exe files without publishing.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }

      - run: npm run build

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: KSTRL-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
