[project]
name = "launch-runner"
version = "0.1.0"
description = "Launch: a local AI runner with its own inference engine and an OpenAI-compatible API"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "safetensors>=0.4",
  "tokenizers>=0.15",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
launch = "launch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["launch"]
